<!DOCTYPE html>
<html>

<head>
    <title>Orders</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/orders.css">
    <link rel="icon" type="image/png" href="images/amazonfavicon.png">
</head>

<body>
    <div class="amazon-header">
        <div class="left-section">
            <a href="amazon.html" class="header-link">
                <img class="amazon-logo" src="images/amazon-logo-white.png">
                <img class="amazon-mobile-logo" src="images/amazon-mobile-logo-white.png">
            </a>
        </div>

        <div class="middle-section">
            <div class="search-container">
                <input class="search-input" type="text" placeholder="Search">

                <button class="search-button">
                    <img class="search-icon" src="images/icons/search-icon.png">
                </button>
            </div>
        </div>

        <div class="right-section">
            <a class="orders-link header-link" href="orders.html">
                <span class="returns-text">Returns</span>
                <span class="orders-text">& Orders</span>
            </a>

            <a class="cart-link header-link" href="checkout.html">
                <img class="cart-icon" src="images/icons/cart-icon.png">
                <div class="cart-count js-cart-quantity"></div>
                <div class="cart-text">Cart</div>
            </a>
        </div>
    </div>

    <div class="main">
        <div class="page-title">Your Orders</div>
        <a class="clear-orders-link link-primary js-clear-orders-link" href="#">
            Clear all orders
        </a>
        <div class="orders-grid js-orders-grid">

        </div>
    </div>

    <script type="module" src="scripts/orders.js"></script>
</body>

</html>
