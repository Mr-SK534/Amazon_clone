<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/body.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/amazon.css">
    <link rel="stylesheet" href="styles/general.css">
</head>

<body>
    <div class="amazon-header">
        <div class="left-section">
            <a class="header-link" href="amazon.html">
                <img class="amazon-logo" 
                src="images/amazon-logo-white.png">
                
            </a>
        </div>
        <div class="middle-section">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Search Amazon">
                <button class="search-button">
                    <img class="search-icon" src="images/icons/search-icon.png">
                </button>
            </div>
        </div>
        <div class="right-section">
            <a class="orders-link header-link" href="orders">
                <span class="returns-text">Returns</span>
                <span class="orders-text">& Orders</span>
            </a>
            <a class="cart-link header-link" href="checkout">
                <div class="cart-icon-wrapper">
                    <img class="cart-icon" src="images/icons/cart-icon.png">
                    <span class="cart-count">3</span>
                </div>
                <div class="cart-text">Cart</div>
            </a>
        </div>
    </div>


    <div class="main">
        <div class="products-grid js-products-grid">
            <div class="product-container">
        </div>
    </div>
    <script src="scripts/amazon.js"></script>
</body>

</html>
